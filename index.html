<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#f5efe7" />
<title>Магазин: Разложи и продай</title>
<style>
:root{
  --bg:#eee7dc;--panel:#fffdf8;--ink:#28323a;--muted:#737b7d;--green:#59bd8d;--green2:#dff7e9;
  --wood:#d39a64;--wood2:#b77742;--line:#ddd3c8;--shadow:0 12px 32px rgba(77,57,39,.14);
  font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);touch-action:none;overscroll-behavior:none;color:var(--ink)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:linear-gradient(180deg,#faf6ef 0%,#ece4d9 100%)}
#game{position:relative;width:100%;height:100%;max-width:760px;margin:0 auto;overflow:hidden}
.topbar{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:8px;z-index:20}
.pill{height:44px;min-width:116px;background:rgba(255,255,255,.94);border:2px solid #e8dfd4;border-radius:15px;display:flex;align-items:center;padding:0 14px;font-weight:800;box-shadow:0 5px 14px rgba(70,50,30,.07)}
.pill.level{justify-content:center;min-width:96px}
.xp-wrap{position:absolute;top:68px;left:50%;transform:translateX(-50%);width:min(44vw,180px);height:9px;background:rgba(42,52,58,.13);border-radius:99px;overflow:hidden;z-index:20}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#50b889,#7ad1a6);border-radius:inherit;transition:width .28s ease}
#goal{position:absolute;top:88px;left:18px;right:18px;text-align:center;font-size:15px;font-weight:800;color:#626b69;z-index:20}
#upgrade{position:absolute;top:118px;left:50%;transform:translateX(-50%);min-width:174px;height:42px;border:0;border-radius:14px;padding:0 16px;color:#fff;font:800 14px/1 inherit;background:#9f9c96;box-shadow:0 7px 18px rgba(0,0,0,.08);z-index:20;transition:transform .1s ease,background .2s ease}
#upgrade.enabled{background:linear-gradient(180deg,#61c797,#4fae80)}
#upgrade.enabled:active{transform:translateX(-50%) scale(.96)}
.store-sign{position:absolute;top:170px;left:50%;transform:translateX(-50%);width:min(88vw,580px);height:46px;background:#34464a;color:#fff;border-radius:18px 18px 9px 9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;letter-spacing:.2px;box-shadow:var(--shadow)}
.store-sign:after{content:"";position:absolute;left:12%;right:12%;bottom:-8px;height:10px;background:repeating-linear-gradient(90deg,#ef6a63 0 28px,#fff 28px 56px);border-radius:0 0 9px 9px}
#shelf{position:absolute;left:50%;transform:translateX(-50%);top:228px;width:min(92vw,620px);padding:15px 13px 19px;background:linear-gradient(180deg,#dfad79,#c88851);border:3px solid #b77945;border-radius:20px;box-shadow:0 20px 36px rgba(98,64,36,.18);display:grid;grid-template-columns:repeat(3,1fr);gap:10px 9px;transition:height .25s ease}
.slot{position:relative;aspect-ratio:1.28/1;min-height:58px;background:linear-gradient(180deg,#fffdf8,#f7f0e6);border:2px solid #e0d5c9;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;box-shadow:inset 0 -5px 0 rgba(120,80,45,.04)}
.slot.valid{border-color:#56c596;background:#ecfff5;transform:scale(1.035);box-shadow:0 0 0 4px rgba(86,197,150,.12)}
.slot.invalid{border-color:#e77b7b;background:#fff0f0;transform:scale(.98)}
.slot .placed{width:82%;height:76%;pointer-events:none}
#tray{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));width:min(94vw,620px);min-height:148px;background:rgba(255,253,248,.96);border:2px solid #dfd4c8;border-radius:24px;box-shadow:0 18px 34px rgba(76,57,38,.16);padding:16px 14px 13px}
.tray-title{font-weight:900;font-size:14px;color:#66706f;margin:0 0 10px 3px;display:flex;align-items:center;justify-content:space-between}
#items{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;align-items:end}
.product{position:relative;height:82px;border-radius:16px;border:2px solid rgba(255,255,255,.72);box-shadow:0 7px 11px rgba(66,48,34,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;cursor:grab;touch-action:none;transition:transform .1s ease,opacity .15s ease;overflow:hidden}
.product:before{content:"";position:absolute;left:14%;right:14%;top:12%;height:15%;background:var(--accent);border-radius:7px;opacity:.95}
.product .glyph{font-size:22px;line-height:1;z-index:1;margin-top:3px}.product .name{font-size:9px;z-index:1;margin-top:8px;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product.drag-source{opacity:.2}.product:active{transform:scale(1.05)}
.drag-ghost{position:fixed;z-index:9999;width:74px;height:78px;pointer-events:none;transform:translate(-50%,-62%) scale(1.08);filter:drop-shadow(0 14px 8px rgba(0,0,0,.2));transition:none!important}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.85);font-size:31px;font-weight:1000;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.16),0 6px 18px rgba(0,0,0,.18);z-index:200;opacity:0;pointer-events:none;white-space:nowrap}
#toast.show{animation:toast .72s cubic-bezier(.19,.82,.31,1)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}70%{opacity:1;transform:translate(-50%,-58%) scale(1)}100%{opacity:0;transform:translate(-50%,-78%) scale(.92)}}
#customer{position:absolute;right:-96px;z-index:120;font-size:62px;filter:drop-shadow(0 10px 6px rgba(0,0,0,.12));transition:right .55s cubic-bezier(.22,.75,.28,1),transform .25s ease;pointer-events:none}
#customer.in{right:7px}.bubble{position:absolute;right:59px;top:-20px;min-width:64px;background:#fff;border:2px solid #e5ddd3;border-radius:16px;padding:8px 10px;font-size:14px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.1);opacity:0;transform:scale(.8);transition:.18s ease}.customer-wrap.buy .bubble{opacity:1;transform:scale(1)}
.coin{position:fixed;font-size:23px;pointer-events:none;z-index:300;animation:coinFly .72s ease-out forwards}@keyframes coinFly{to{transform:translate(var(--dx),var(--dy)) scale(.55);opacity:0}}
.spark{position:fixed;width:8px;height:8px;background:#ffe271;border-radius:50%;pointer-events:none;z-index:250;animation:spark .58s ease-out forwards}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
#hint{position:absolute;left:50%;bottom:174px;transform:translateX(-50%);font-size:12px;font-weight:800;color:#7c807e;background:rgba(255,255,255,.72);padding:7px 11px;border-radius:99px;z-index:18;pointer-events:none;transition:opacity .3s ease;white-space:nowrap}
#version{position:absolute;right:10px;bottom:5px;font-size:9px;color:rgba(60,60,60,.35);z-index:10}
@media (max-width:430px){.pill{min-width:104px;padding:0 11px;font-size:15px}.pill.level{min-width:87px}.store-sign{top:166px}#shelf{top:222px}.product{height:74px}.product .glyph{font-size:20px}.product .name{font-size:8px}#tray{min-height:138px;padding-top:14px}#hint{bottom:160px}}
@media (orientation:landscape) and (max-height:560px){#game{max-width:none}.topbar{top:6px}.pill{height:38px}.xp-wrap{top:51px}#goal{top:64px;font-size:13px}#upgrade{top:89px;height:36px}.store-sign{top:132px;width:min(58vw,570px);height:38px}#shelf{top:182px;width:min(61vw,600px);padding:10px}#tray{right:13px;left:auto;transform:none;bottom:13px;width:32vw;min-height:auto;padding:10px;border-radius:18px}#items{grid-template-columns:repeat(3,1fr)}.product{height:54px}.tray-title{margin-bottom:6px}.product .name{display:none}#hint{display:none}}
</style>
</head>
<body>
<div id="app"><main id="game">
  <div class="topbar"><div class="pill" id="coins">🪙 40</div><div class="pill level" id="level">Ур. 1</div></div>
  <div class="xp-wrap"><div id="xpFill"></div></div>
  <div id="goal">Перетащи 3 одинаковых товара на одну полку</div>
  <button id="upgrade" type="button">Нужно 120 🪙</button>
  <div class="store-sign">Магазин у дома</div>
  <section id="shelf" aria-label="Полки"></section>
  <div id="hint">👆 Зажми товар и перетащи на полку</div>
  <div id="customer" class="customer-wrap"><div class="bubble" id="bubble">Беру!</div><span id="customerEmoji">🧑‍🛒</span></div>
  <section id="tray"><div class="tray-title"><span>📦 Поставка</span><span id="trayStatus">6 товаров</span></div><div id="items"></div></section>
  <div id="toast">PERFECT!</div><div id="version">mobile preview · 0.3</div>
</main></div>
<script>
(() => {
'use strict';
const RU = (navigator.language || 'ru').toLowerCase().startsWith('ru');
const T = RU ? {
  level:n=>`Ур. ${n}`, goal:'Перетащи 3 одинаковых товара на одну полку', goalGood:'Отлично! Собери следующую полку',
  need:n=>`Нужно ${n} 🪙`, upgrade:n=>`+1 полка · ${n} 🪙`, max:'Полки улучшены', supply:'товаров', perfect:'PERFECT!', combo:n=>`COMBO x${n}`
} : {
  level:n=>`Lv. ${n}`, goal:'Drag 3 identical products onto one shelf', goalGood:'Nice! Fill the next shelf',
  need:n=>`Need ${n} 🪙`, upgrade:n=>`+1 shelf · ${n} 🪙`, max:'Shelves upgraded', supply:'items', perfect:'PERFECT!', combo:n=>`COMBO x${n}`
};
const PRODUCTS = [
  {id:'juice',name:RU?'Сок':'Juice',glyph:'J',color:'#f6a612',accent:'#fff0b9',sell:9},
  {id:'milk',name:RU?'Молоко':'Milk',glyph:'M',color:'#f7fbff',accent:'#62adff',sell:11},
  {id:'water',name:RU?'Вода':'Water',glyph:'W',color:'#52b6ff',accent:'#d9f2ff',sell:8},
  {id:'cola',name:RU?'Кола':'Cola',glyph:'C',color:'#d94b60',accent:'#ffdde3',sell:10},
  {id:'bread',name:RU?'Хлеб':'Bread',glyph:'B',color:'#d99a54',accent:'#ffddb0',sell:12},
  {id:'cookies',name:RU?'Печенье':'Cookies',glyph:'K',color:'#9f6d43',accent:'#f5c98e',sell:14}
];
const $ = s=>document.querySelector(s);
const shelf=$('#shelf'), items=$('#items'), coinsEl=$('#coins'), levelEl=$('#level'), xpFill=$('#xpFill'), goal=$('#goal'), upgrade=$('#upgrade'), toast=$('#toast'), customer=$('#customer'), bubble=$('#bubble'), trayStatus=$('#trayStatus'), hint=$('#hint');
const SAVE_KEY='shop-sort-sell-mobile-preview-v3';
let state=load(),slots=[],drag=null,combo={count:0,expiresAt:0},salesBusy=new Set(),supplyRound=0,audioCtx=null;
function fresh(){return {coins:40,xp:0,level:1,totalSales:0,shelfLevel:0,rows:3,board:Array(9).fill(null)}}
function load(){try{const v=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(v&&Array.isArray(v.board)&&Number.isFinite(v.coins))return Object.assign(fresh(),v)}catch{}return fresh()}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch{}}
function xpNeed(level){return 60+Math.max(0,level-1)*35}
function grantXp(amount){state.xp+=Math.max(0,Math.floor(amount));while(state.xp>=xpNeed(state.level)){state.xp-=xpNeed(state.level);state.level++;showToast(RU?'НОВЫЙ УРОВЕНЬ!':'LEVEL UP!')}}
function upgradeCost(){return Math.round(120*Math.pow(1.7,state.shelfLevel))}
function product(id){return PRODUCTS.find(p=>p.id===id)||PRODUCTS[0]}
function productNode(p,placed=false){const el=document.createElement('div');el.className='product'+(placed?' placed':'');el.dataset.id=p.id;el.style.background=p.color;el.style.setProperty('--accent',p.accent);el.innerHTML=`<span class="glyph">${p.glyph}</span><span class="name">${p.name}</span>`;return el}
function renderShelf(){shelf.innerHTML='';slots=[];state.rows=state.shelfLevel>0?4:3;const need=state.rows*3;if(state.board.length<need)state.board.push(...Array(need-state.board.length).fill(null));for(let i=0;i<need;i++){const el=document.createElement('div');el.className='slot';el.dataset.index=i;const id=state.board[i];if(id)el.appendChild(productNode(product(id),true));shelf.appendChild(el);slots.push(el)}layoutShelf()}
function layoutShelf(){const trayTop=$('#tray').getBoundingClientRect().top,top=shelf.getBoundingClientRect().top,maxH=Math.max(210,trayTop-top-64),wanted=state.rows*(innerWidth>innerHeight?67:82)+(state.rows-1)*10+34;shelf.style.height=Math.min(maxH,wanted)+'px';customer.style.top=(Math.min(innerHeight*.56,top+100))+'px'}
function makeSupply(){if(items.children.length)return;const rounds=[['juice','juice','juice','milk','milk','milk'],['water','water','water','cola','cola','cola'],['bread','bread','bread','cookies','cookies','cookies']],arr=rounds[supplyRound++%rounds.length];arr.forEach(id=>{const el=productNode(product(id));el.addEventListener('pointerdown',startDrag);items.appendChild(el)});trayStatus.textContent=`${arr.length} ${T.supply}`}
function canPlace(id,index){if(index<0||index>=state.board.length||state.board[index])return false;const row=Math.floor(index/3),start=row*3;for(let i=0;i<3;i++){const v=state.board[start+i];if(v&&v!==id)return false}return true}
function startDrag(e){if(salesBusy.size)return;const src=e.currentTarget,p=product(src.dataset.id);e.preventDefault();src.setPointerCapture?.(e.pointerId);const ghost=productNode(p);ghost.classList.add('drag-ghost');document.body.appendChild(ghost);src.classList.add('drag-source');drag={src,ghost,id:p.id,pointerId:e.pointerId,slot:-1};moveGhost(e.clientX,e.clientY);hint.style.opacity='0';src.addEventListener('pointermove',moveDrag);src.addEventListener('pointerup',endDrag,{once:true});src.addEventListener('pointercancel',cancelDrag,{once:true});haptic(8);tone(270,.035,.018)}
function moveGhost(x,y){if(!drag)return;drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px'}
function moveDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;e.preventDefault();moveGhost(e.clientX,e.clientY);let best=-1,bestD=1e9;slots.forEach((s,i)=>{const r=s.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(e.clientX-cx,e.clientY-cy);if(d<bestD){bestD=d;best=i}});slots.forEach(s=>s.classList.remove('valid','invalid'));if(best>=0&&bestD<110){drag.slot=best;slots[best].classList.add(canPlace(drag.id,best)?'valid':'invalid')}else drag.slot=-1}
function cleanupDrag(){if(!drag)return;drag.src.classList.remove('drag-source');drag.ghost.remove();slots.forEach(s=>s.classList.remove('valid','invalid'));drag=null}
function cancelDrag(){cleanupDrag()}
function endDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;const {src,id,slot}=drag;if(slot>=0&&canPlace(id,slot)){state.board[slot]=id;src.remove();placeFeedback(slots[slot]);cleanupDrag();renderShelf();save();checkRow(Math.floor(slot/3));makeSupply()}else{drag.ghost.animate([{transform:'translate(-50%,-62%) scale(1.08)'},{transform:'translate(-50%,-62%) scale(.75)',opacity:.15}],{duration:170,easing:'ease-out'});haptic([10,25,10]);tone(145,.07,.012);setTimeout(cleanupDrag,150)}}
function placeFeedback(slot){haptic(12);tone(520,.045,.025);for(let i=0;i<5;i++)sparkAt(slot)}
function checkRow(row){const start=row*3,ids=state.board.slice(start,start+3);if(ids[0]&&ids.every(v=>v===ids[0])){const now=Date.now();combo.count=(combo.count&&now<=combo.expiresAt)?combo.count+1:1;combo.expiresAt=now+4500;showToast(combo.count>1?T.combo(combo.count):T.perfect);haptic([15,25,35]);tone(740,.07,.045);setTimeout(()=>spawnCustomer(row,ids[0]),430);goal.textContent=T.goalGood}}
function spawnCustomer(row,id){if(salesBusy.has(row))return;salesBusy.add(row);const center=slots[row*3+1]?.getBoundingClientRect();if(center)customer.style.top=(center.top+center.height/2-40)+'px';$('#customerEmoji').textContent=['🧑‍🛒','👩‍🛒','👨‍🛒'][state.totalSales%3];bubble.textContent=RU?'Беру!':'I’ll take it!';customer.classList.add('in');setTimeout(()=>customer.classList.add('buy'),430);setTimeout(()=>completeSale(row,id),950)}
function completeSale(row,id){const p=product(id),mult=1+Math.min(5,combo.count)*.05,earned=Math.max(1,Math.round(p.sell*3*mult));state.coins+=earned;grantXp(4+Math.ceil(p.sell*1.05));state.totalSales+=3;const start=row*3;for(let i=0;i<3;i++)state.board[start+i]=null;coinBurst(earned,row);tone(880,.06,.04);setTimeout(()=>tone(1160,.06,.035),70);haptic(20);customer.classList.remove('buy','in');salesBusy.delete(row);updateHud();renderShelf();makeSupply();goal.textContent=T.goal;save()}
function updateHud(){coinsEl.textContent=`🪙 ${state.coins}`;levelEl.textContent=T.level(state.level);xpFill.style.width=Math.min(100,state.xp/xpNeed(state.level)*100)+'%';const cost=upgradeCost();if(state.shelfLevel>=1){upgrade.textContent=T.max;upgrade.classList.remove('enabled');upgrade.disabled=true}else{const ok=state.coins>=cost;upgrade.textContent=ok?T.upgrade(cost):T.need(cost);upgrade.classList.toggle('enabled',ok);upgrade.disabled=!ok}}
upgrade.addEventListener('click',()=>{if(state.shelfLevel>=1)return;const cost=upgradeCost();if(state.coins<cost)return;state.coins-=cost;state.shelfLevel++;state.rows=4;state.board.push(null,null,null);showToast(RU?'НОВАЯ ПОЛКА!':'NEW SHELF!');haptic([20,25,40]);tone(660,.08,.04);setTimeout(()=>tone(990,.12,.04),95);updateHud();renderShelf();save()});
function showToast(text){toast.textContent=text;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show')}
function sparkAt(el){const r=el.getBoundingClientRect(),s=document.createElement('i');s.className='spark';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';const a=Math.random()*Math.PI*2,d=28+Math.random()*38;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),620)}
function coinBurst(amount,row){const rect=slots[row*3+1]?.getBoundingClientRect();if(!rect)return;for(let i=0;i<7;i++){const c=document.createElement('span');c.className='coin';c.textContent='🪙';c.style.left=(rect.left+rect.width/2-10)+'px';c.style.top=(rect.top+rect.height/2-10)+'px';c.style.setProperty('--dx',(-70+Math.random()*140)+'px');c.style.setProperty('--dy',(-80-Math.random()*80)+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),760)}showToast(`+${amount} 🪙`)}
function haptic(pattern){try{navigator.vibrate?.(pattern)}catch{}}
function tone(freq,dur,vol){try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
window.addEventListener('resize',()=>requestAnimationFrame(layoutShelf));document.addEventListener('visibilitychange',()=>{if(document.hidden&&drag)cleanupDrag()});
function boot(){document.documentElement.lang=RU?'ru':'en';goal.textContent=T.goal;updateHud();renderShelf();makeSupply();setTimeout(()=>showToast(RU?'РАЗЛОЖИ ТОВАРЫ':'STOCK THE SHELVES'),500)}boot();
})();
</script>
</body>
</html>
